name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: "False"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify independent golden oracle
        run: python evals/reference_oracle.py --check
      - name: Lint
        run: python -m ruff check app evals tests
      - name: Type check
        run: python -m mypy app evals
      - name: Test
        run: python -m pytest -q
      - name: Build local artifacts
        run: python -m app index
      - name: Run offline evaluation
        run: python -m app eval