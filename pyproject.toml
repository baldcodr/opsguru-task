[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudnova-invoice-qa"
version = "0.1.0"
description = "Hybrid retrieval and deterministic Q&A over CloudNova invoices"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb==1.0.20",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "evals"]
